function beep(seq){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.9})}catch(e){}}
const sfx={ok:()=>beep([[523,.12],[659,.12],[784,.25]]),no:()=>beep([[300,.2],[220,.3]]),click:()=>beep([[600,.06]]),win:()=>beep([[523,.12],[659,.12],[784,.12],[1046,.35]])};
function say(t){try{speechSynthesis.cancel();if(!S.voice)return;const u=new SpeechSynthesisUtterance(t);u.lang="id-ID";u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
function tog(){return `<div class="flex gap-2 justify-end mb-2">
<button class="btn bg-white text-sm" onclick="S.snd=!S.snd;sfx.click();R()">${S.snd?"🔊 Efek: ON":"🔇 Efek: OFF"}</button>
<button class="btn bg-white text-sm" onclick="S.voice=!S.voice;if(!S.voice)speechSynthesis.cancel();R()">${S.voice?"🗣️ Suara: ON":"🤐 Suara: OFF"}</button></div>`}
let G=null,view="start",first=true;
function toast(t){sfx.no();const d=document.createElement("div");d.className="fixed left-3 right-3 z-50 bg-red-600 text-white rounded-2xl p-3 font-semibold pop text-center";d.style.top="calc(env(safe-area-inset-top,0px) + 12px)";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),7000)}
function flag(why){if(view!=="quiz"||!G||G.stop||Date.now()-G.lt<1500)return;G.lt=Date.now();G.cheat++;G.log.push(why);sfx.no();try{speechSynthesis.cancel()}catch(e){}
const st=G.cheat>=3;if(st)G.stop=true;
try{if(S.db)S.db.collection("results").doc(G.id).set({id:G.id,nama:G.n,kelas:KLS[G.k],skor:G.s,benar:G.ok,waktu:new Date().toISOString(),durasi:Math.round((Date.now()-G.t)/1000),curang:G.cheat,alasan:[...new Set(G.log)].join(", ")}).catch(()=>{})}catch(e){}
const w=document.getElementById("wm");if(w)w.remove();const o=document.createElement("div");o.id="wm";o.className="fixed inset-0 z-50 flex items-center justify-center p-4";o.style.background="rgba(0,0,0,.65)";
o.innerHTML=`<div class="card p-6 text-center pop max-w-sm"><div class="text-5xl">⚠️</div><h3 class="text-xl font-bold text-red-600 my-2">Peringatan ${G.cheat}/3</h3><p>Terdeteksi: <b>${why}</b>.<br>Ayo kerjakan sendiri dengan jujur ya! Catatan ini dikirim ke gurumu.</p>${st?"<p class='font-bold mt-2 text-red-600'>Batas pelanggaran tercapai, kuis dihentikan.</p>":""}<button class="btn bg-red-500 text-white mt-4" onclick="document.getElementById('wm').remove();${st?"finish()":""}">${st?"Lihat Hasil":"Saya mengerti"}</button></div>`;document.body.appendChild(o)}
document.addEventListener("visibilitychange",()=>{if(document.hidden)flag("pindah tab atau aplikasi")});
window.addEventListener("blur",()=>flag("keluar dari halaman kuis"));
["copy","cut","paste"].forEach(e=>document.addEventListener(e,ev=>{if(view==="quiz"){ev.preventDefault();flag("menyalin atau menempel teks")}}));
document.addEventListener("contextmenu",ev=>{if(view==="quiz"){ev.preventDefault();flag("klik kanan")}});
document.addEventListener("keydown",ev=>{if(view==="quiz"&&(ev.ctrlKey||ev.metaKey)&&["c","v","x","u","s","p","f"].includes(ev.key.toLowerCase())){ev.preventDefault();flag("pintasan keyboard terlarang")}});
function R(){({start:vStart,quiz:vQuiz,res:vRes,teach:vTeach})[view]()}
function vStart(){
app.innerHTML=tog()+`<div class="card p-6 pop text-center">
<div class="text-6xl mb-2">🇮🇩💰</div>
<h1 class="text-3xl font-bold text-purple-600">Kuis Ekonomi Indonesia</h1>
<p class="text-slate-500 mb-4">Sistem Ekonomi dalam Perekonomian Indonesia</p>
<input id="nm" maxlength="40" placeholder="Nama lengkapmu" class="w-full border-4 border-yellow-300 rounded-2xl p-3 mb-3 text-center font-semibold outline-none focus:border-purple-400">
<select id="kl" class="w-full border-4 border-pink-300 rounded-2xl p-3 mb-4 text-center font-semibold bg-white">${KLS.map((k,i)=>`<option value="${i}">Kelas ${k} · Level ${LVL[i]}</option>`).join("")}</select>
<p class="text-xs text-slate-500 mb-3">🛡️ Kuis diawasi. Pindah tab, menyalin soal, atau klik kanan akan dicatat dan guru diberi tahu.</p><button class="btn bg-gradient-to-r from-purple-500 to-pink-500 text-white w-full text-xl py-3" onclick="start()">🚀 Mulai Kuis!</button>
<button class="mt-4 text-sm text-slate-500 underline" onclick="sfx.click();view='teach';R()">👩‍🏫 Dasbor Guru</button></div>`}
function start(){const n=$("nm").value.trim();if(!n){$("nm").classList.add("border-red-400");$("nm").placeholder="Isi namamu dulu ya 😊";return}
const k=+$("kl").value;G={n,k,i:0,s:0,ok:0,cheat:0,log:[],lt:0,id:Date.now()+"-"+Math.random().toString(36).slice(2,7),t:Date.now(),qs:Q[k].map(x=>{const c=x.o[0],o=x.o.slice().sort(()=>Math.random()-.5);return{q:x.q,o,a:o.indexOf(c),e:x.e}}),done:false};sfx.click();view="quiz";R()}
function vQuiz(){const q=G.qs[G.i];G.done=false;
app.innerHTML=tog()+`<div class="card p-5 pop"><div class="flex justify-between text-sm font-bold text-purple-600 mb-2"><span>Halo, ${esc(G.n)}! (${KLS[G.k]})</span><span>⭐ ${G.s}</span></div>
<div class="h-3 bg-slate-200 rounded-full mb-4"><div class="h-3 rounded-full bg-gradient-to-r from-yellow-400 to-pink-500" style="width:${G.i*10}%"></div></div>
<div class="text-sm text-slate-500 mb-1">Soal ${G.i+1} dari 10</div>
<h2 class="text-xl font-bold mb-4">${esc(q.q)}</h2>
${q.o.map((o,i)=>`<button class="opt" onclick="pick(${i})">${"ABCD"[i]}. ${esc(o)}</button>`).join("")}
<button class="text-sm text-purple-600 underline" onclick="say(narr())">🔈 Bacakan lagi</button><div id="fb"></div></div>`;
say(narr())}
const narr=()=>{const q=G.qs[G.i];return "Soal "+(G.i+1)+". "+q.q+" "+q.o.map((o,i)=>"Pilihan "+"ABCD"[i]+". "+o).join(". ")};
const PUJI=["Hebat sekali! 🎉","Keren, kamu jago! 🌟","Mantap, pertahankan! 💪","Luar biasa, otakmu encer! 🧠"],SEMANGAT=["Belum tepat, tapi kamu hebat sudah mencoba! 💛","Tidak apa-apa, salah itu bagian dari belajar! 🌱","Hampir! Yuk pelajari langkahnya! 🔍"];
function pick(i){if(G.done)return;G.done=true;const q=G.qs[G.i],ok=i===q.a;if(ok){G.s+=10;G.ok++;sfx.ok()}else sfx.no();
document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===q.a)b.style.cssText="border-color:#22c55e;background:#dcfce7";else if(j===i)b.style.cssText="border-color:#ef4444;background:#fee2e2"});
const m=(ok?PUJI:SEMANGAT)[Math.floor(Math.random()*(ok?4:3))];
$("fb").innerHTML=`<div class="pop mt-3 p-4 rounded-2xl ${ok?"bg-green-100":"bg-orange-100"}"><div class="font-bold text-lg">${m}</div>
${ok?"":`<div class="mt-1"><b>Jawaban benar:</b> ${esc(q.o[q.a])}</div>`}
<div class="mt-1"><b>${ok?"Cara mengerjakan":"Langkah penyelesaian yang benar"}:</b> ${esc(q.e)}</div></div>
<button class="btn bg-purple-500 text-white w-full mt-3" onclick="next()">${G.i<9?"Lanjut ➡️":"Lihat Hasil 🏆"}</button>`;
say(m.replace(/[^\w\s,!.]/g,"")+" "+(ok?"":"Jawaban benar: "+q.o[q.a]+". ")+q.e)}
function next(){speechSynthesis.cancel();sfx.click();if(G.i<9){G.i++;vQuiz()}else{finish()}}
async function finish(){view="res";sfx.win();const r={id:G.id,nama:G.n,kelas:KLS[G.k],skor:G.s,benar:G.ok,waktu:new Date().toISOString(),durasi:Math.round((Date.now()-G.t)/1000),curang:G.cheat,alasan:[...new Set(G.log)].join(", ")};
let saved=false;try{if(S.db){await S.db.collection("results").doc(r.id).set(r);saved=true}}catch(e){}
if(!saved)S.rows.push(r);G.saved=saved;R()}
function vRes(){const s=G.s,m=s>=80?"Luar biasa! Kamu bintang ekonomi! 🌟":s>=60?"Bagus sekali, terus berlatih! 👏":"Tetap semangat, ulangi lagi supaya makin paham! 💪";
app.innerHTML=tog()+`<div class="card p-6 text-center pop"><div class="text-6xl">${s>=80?"🏆":s>=60?"🥈":"🌱"}</div><h2 class="text-2xl font-bold text-purple-600">Selesai, ${esc(G.n)}!</h2>
<div class="text-6xl font-bold my-3 text-pink-500">${s}</div><p>Benar ${G.ok} dari 10 · Kelas ${KLS[G.k]}</p><p class="mt-2 font-semibold">${m}</p>${G.cheat?`<p class="mt-2 text-red-600 text-sm font-semibold">⚠️ Tercatat ${G.cheat} pelanggaran (${esc([...new Set(G.log)].join(", "))}). Guru dapat melihat catatan ini.</p>`:""}
<p class="text-xs text-slate-400 mt-2">${G.saved?"✅ Nilai tersimpan ke database guru":"⚠️ Database tidak tersambung, nilai hanya tersimpan di perangkat ini"}</p>
<button class="btn bg-gradient-to-r from-purple-500 to-pink-500 text-white w-full mt-4" onclick="view='start';R()">🔁 Main Lagi</button></div>`;say(m.replace(/[^\w\s,!.]/g,"")+" Skormu "+s)}
let unsub=null;
async function vTeach(){
if(!S.teacher){const own=S.user&&S.user.isOwner&&S.user.isOwner();if(own)S.teacher=true;else{app.innerHTML=`<div class="card p-6 text-center pop"><h2 class="text-xl font-bold mb-3">👩‍🏫 Dasbor Guru</h2><input id="pin" type="password" placeholder="PIN guru" class="border-4 border-yellow-300 rounded-2xl p-3 text-center w-full mb-3"><button class="btn bg-purple-500 text-white w-full" onclick="if($('pin').value==='guru123'){S.teacher=true;vTeach()}else{$('pin').value='';$('pin').placeholder='PIN salah'}">Masuk</button><button class="mt-3 text-sm underline" onclick="view='start';R()">← Kembali</button><p class="text-xs text-slate-400 mt-3">PIN bawaan: guru123 (pemilik halaman otomatis masuk)</p></div>`;return}}
if(S.db&&!unsub){try{unsub=S.db.collection("results").onSnapshot(sn=>{if(!first)sn.docChanges().forEach(c=>{const d=c.doc.data();if(c.type==="added"&&d.curang>0)toast("🚨 "+d.nama+" ("+d.kelas+") terindikasi mencontek: "+(d.alasan||""))});first=false;S.rows=sn.docs.map(d=>d.data());if(view==="teach")drawT()})}catch(e){}}
drawT()}
const rowsF=()=>S.rows.filter(r=>(S.filter==="all"||r.kelas===S.filter)&&(!S.flag||r.curang>0)).sort((a,b)=>b.waktu.localeCompare(a.waktu));
function drawT(){const fl=S.rows.filter(r=>r.curang>0),rs=rowsF(),avg=rs.length?(rs.reduce((a,r)=>a+r.skor,0)/rs.length).toFixed(1):"-";
app.innerHTML=`<div class="card p-4 pop"><div class="flex justify-between items-center mb-3"><h2 class="text-xl font-bold">👩‍🏫 Rekap Nilai <span class="text-xs text-green-600">● ${S.db?"real-time":"lokal"}</span></h2><button class="underline text-sm" onclick="view='start';R()">← Kuis</button></div>
<div class="grid grid-cols-3 gap-2 text-center mb-3"><div class="bg-yellow-100 rounded-2xl p-2"><div class="text-2xl font-bold">${rs.length}</div><div class="text-xs">Peserta</div></div><div class="bg-pink-100 rounded-2xl p-2"><div class="text-2xl font-bold">${avg}</div><div class="text-xs">Rata-rata</div></div><div class="bg-cyan-100 rounded-2xl p-2"><div class="text-2xl font-bold">${rs.length?Math.max(...rs.map(r=>r.skor)):"-"}</div><div class="text-xs">Tertinggi</div></div></div>
${fl.length?`<div class="bg-red-500 text-white rounded-2xl p-3 mb-3 font-semibold">🚨 ${fl.length} siswa terindikasi mencontek: ${fl.slice(0,5).map(r=>esc(r.nama)+" ("+esc(r.kelas)+")").join(", ")}${fl.length>5?" dst.":""}</div>`:`<div class="bg-green-100 rounded-2xl p-3 mb-3 text-sm">✅ Belum ada indikasi mencontek</div>`}<select class="border-2 rounded-xl p-2 mb-3" onchange="S.filter=this.value;drawT()"><option value="all">Semua kelas</option>${KLS.map(k=>`<option ${S.filter===k?"selected":""}>${k}</option>`).join("")}</select>
<label class="ml-2 text-sm"><input type="checkbox" ${S.flag?"checked":""} onchange="S.flag=this.checked;drawT()"> Hanya yang terindikasi</label><div class="flex gap-2 mb-3 flex-wrap"><button class="btn bg-green-500 text-white text-sm" onclick="exp('xlsx')">📗 Excel</button><button class="btn bg-red-500 text-white text-sm" onclick="exp('pdf')">📕 PDF</button><button class="btn bg-blue-500 text-white text-sm" onclick="exp('doc')">📘 Word</button></div><div id="msg" class="text-xs text-red-500"></div>
<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="bg-purple-100 text-left"><th class="p-2">Nama</th><th>Kelas</th><th>Skor</th><th>Benar</th><th>Waktu</th><th>Pelanggaran</th></tr></thead><tbody>${rs.map(r=>`<tr class="border-b ${r.curang>0?"bg-red-100":""}"><td class="p-2">${r.curang>0?"🚨 ":""}${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td class="font-bold">${r.skor}</td><td>${r.benar}/10</td><td>${new Date(r.waktu).toLocaleString("id-ID")}</td><td>${r.curang>0?`<b class="text-red-600">${r.curang}x</b> ${esc(r.alasan||"")}`:"-"}</td></tr>`).join("")||`<tr><td colspan="6" class="p-4 text-center text-slate-400">Belum ada data</td></tr>`}</tbody></table></div></div>`}
async function exp(t){const rs=rowsF(),H=["No","Nama","Kelas","Skor","Benar","Waktu","Pelanggaran"],B=rs.map((r,i)=>[i+1,r.nama,r.kelas,r.skor,r.benar+"/10",new Date(r.waktu).toLocaleString("id-ID"),r.curang>0?r.curang+"x: "+(r.alasan||""):"-"]);let data,fn="rekap-kuis-ekonomi";
try{if(t==="xlsx"){const ws=XLSX.utils.aoa_to_sheet([H,...B]),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Rekap");data=new Uint8Array(XLSX.write(wb,{type:"array",bookType:"xlsx"}));fn+=".xlsx"}
else if(t==="pdf"){const d=new jspdf.jsPDF();d.text("Rekap Nilai Kuis Ekonomi Indonesia",14,15);d.autoTable({head:[H],body:B,startY:22});data=new Uint8Array(d.output("arraybuffer"));fn+=".pdf"}
else{data=new Blob(["<html><head><meta charset='utf-8'></head><body><h2>Rekap Nilai Kuis Ekonomi Indonesia</h2><table border='1' cellpadding='4'><tr>"+H.map(h=>"<th>"+h+"</th>").join("")+"</tr>"+B.map(r=>"<tr>"+r.map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>").join("")+"</table></body></html>"],{type:"application/msword"});fn+=".doc"}
const dl=await claude.use("downloads");if(!dl)throw 0;await dl.save({filename:fn,data})}catch(e){$("msg").textContent="Unduhan gagal atau dibatalkan"+(e&&e.message?": "+e.message:"")}}
(async()=>{try{S.db=await claude.use("db")}catch(e){}try{S.user=await claude.use("user")}catch(e){}R()})();
R();
</script></body></html>
